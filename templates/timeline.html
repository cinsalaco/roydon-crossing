<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F3F5">
<title>Roydon level crossing – next 90 minutes</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root { --green: #0E6B3A; --amber: #E08A00; --red: #B81F1E; --blue: #1565c0; --ink: #15171a; --bg: #F2F3F5; --rule: rgba(21,23,26,0.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Archivo', system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .page { width: 100%; max-width: 520px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); }
  .header { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .back { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: inherit; text-decoration: none; border-radius: 50%; }
  .back:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .header h1 { font-size: 20px; font-weight: 700; flex: 1; }
  .header .updated { font-size: 14px; font-weight: 500; opacity: 0.7; white-space: nowrap; }
  .header .updated.warn { opacity: 1; color: var(--red); font-weight: 600; }

  .glance { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .glance-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 500; }
  .legend { display: inline-flex; align-items: center; gap: 12px; opacity: 0.8; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .strip { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px; }
  .strip div { min-width: 2px; }
  .hidden { display: none !important; }
  .strip .open { background: var(--green); }
  .strip .closed { background: var(--red); }
  .strip .closed.now { background: #7A1211; }
  .period.closed.now .dot, .period.closed.now .line, .period.closed.now .seg { background: #7A1211; }
  .strip-lift { position: absolute; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); transform: translateX(-50%); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.35); pointer-events: none; }
  .legend i.dot { border-radius: 50%; background: var(--amber); }
  .strip-axis { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.6; }

  .timeline { display: flex; flex-direction: column; margin-top: 28px; }
  .period { display: flex; gap: 14px; }
  .when { width: 54px; text-align: right; flex-shrink: 0; }
  .when .t { font-size: 20px; font-weight: 700; line-height: 1; }
  .when .d { font-size: 13px; opacity: 0.6; margin-top: 3px; }
  .rail { width: 16px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .rail .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
  .rail .line { flex: 1; width: 4px; min-height: 24px; }
  .rail .seg { width: 4px; flex-shrink: 0; }
  .rail .lift { width: 4px; height: 40px; flex-shrink: 0; background: repeating-linear-gradient(to bottom, var(--amber) 0 5px, transparent 5px 9px); }
  .period.open .dot, .period.open .line { background: var(--green); }
  .period.closed .dot, .period.closed .line, .period.closed .seg { background: var(--red); }
  .body { flex: 1; padding-bottom: 20px; display: flex; flex-direction: column; min-width: 0; }
  .label { font-size: 20px; font-weight: 700; line-height: 1; }
  .period.open .label { color: var(--green); }
  .period.closed .label { color: var(--red); }
  .train { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; font-size: 15px; border-bottom: 1px solid var(--rule); }
  .train:first-of-type { margin-top: 4px; padding-top: 10px; }
  .train:last-child { border-bottom: 0; }
  .train .t { width: 44px; flex-shrink: 0; display: inline-flex; flex-direction: column; line-height: 1.1; font-weight: 700; }
  .train .t .delta { font-size: 12px; font-weight: 700; margin-left: 4px; padding: 1px 5px; border-radius: 4px; color: #fff; background: var(--red); }
  .train .t .delta.early { background: var(--blue); }
  .train .t.late { color: var(--red); }
  .train .t.early { color: var(--blue); }
  .train .route { flex: 1; min-width: 0; }
  .train .tag { font-size: 13px; opacity: 0.7; white-space: nowrap; }
  .train .tag.late { color: var(--red); opacity: 1; font-weight: 600; }
  .train .tag.early { color: var(--blue); opacity: 1; font-weight: 600; }
  .train.gone { opacity: 0.55; }
  .lift-note { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 6px 0; border-radius: 6px; background: rgba(224,138,0,0.2); color: #5a3a00; font-size: 13px; font-weight: 600; }
  .empty, .footer { font-size: 13px; opacity: 0.75; line-height: 1.4; margin-top: 24px; }
  .empty { font-size: 16px; opacity: 0.8; }
  .version { font-size: 11px; opacity: 0.45; margin-top: 14px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="page">
  <div class="header">
    <a class="back" href="/" aria-label="Back to crossing status"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1>Next 90 minutes</h1>
    <span class="updated" id="updated">Loading…</span>
  </div>

  <section class="glance" aria-label="At a glance">
    <div class="glance-head"><span style="opacity:0.7">At a glance</span><span class="legend"><span><i style="background: var(--green)"></i>open</span><span><i style="background: var(--red)"></i>closed</span><span id="legendLift" class="hidden"><i class="dot"></i>may lift</span></span></div>
    <div style="position: relative">
      <div class="strip" id="strip" role="img" aria-label="Open and closed periods over the next 90 minutes"></div>
      <div id="stripLifts"></div>
    </div>
    <div class="strip-axis" id="stripAxis"></div>
  </section>

  <section class="timeline" id="timeline"></section>

  <div class="footer">Estimated from live train data: the barrier goes down about 2 minutes before each train and lifts just after it. Always follow the lights and barrier at the crossing.</div>
  <div class="version" id="version"></div>
</main>

<script src="/static/crossing.js"></script>
<script>
(function () {
  const C = window.Crossing;
  const $ = id => document.getElementById(id);

  function trainRow(tr, now) {
    const gone = tr.openAt <= now;
    const cls = tr.late ? 'late' : tr.early ? 'early' : '';
    let time = C.hhmm(tr.at);
    if (tr.late) time += `<span class="delta">${tr.late} min late</span>`;
    else if (tr.early) time += `<span class="delta early">${tr.early} min early</span>`;
    let tag = tr.stops ? 'stops here' : 'passes through';
    if (tr.freight) tag = 'freight';
    if (gone) tag = 'gone';
    else if (tr.late) tag = `${tr.late} min late`;
    else if (tr.early) tag = `${tr.early} min early`;
    return `<div class="train${gone ? ' gone' : ''}"><span class="t">${time}</span><span class="route">${tr.origin} to ${tr.destination}</span><span class="tag ${cls}">${tag}</span></div>`;
  }

  function liftNote(l) {
    return `<div class="lift-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg><span>Possible brief lift ~${C.hhmm(l.at)} — don't rely on it</span></div>`;
  }

  function periodHtml(p, now, isFirst) {
    const when = isFirst && p.start <= now ? 'now' : C.hhmm(p.start);
    const dur = `${Math.max(1, Math.round(p.seconds / 60))} min ${p.kind}`;
    let body = `<div class="label">${p.kind === 'open' ? 'Open' : 'Closed'}</div>`;
    let rail = `<div class="dot"></div>`;
    if (p.kind === 'closed') {
      const c = p.closure;
      c.trains.forEach((tr, i) => {
        body += trainRow(tr, now);
        const lift = c.lifts.find(l => l.beforeTrain === c.trains[i + 1]);
        if (lift) body += liftNote(lift);
      });
      if (c.lifts.length) {
        // red, then a dashed amber break per possible lift, then red
        rail += `<div class="seg" style="height:64px"></div>`;
        c.lifts.forEach(() => { rail += `<div class="lift"></div><div class="seg" style="height:24px"></div>`; });
        rail += `<div class="line"></div>`;
      } else {
        rail += `<div class="line"></div>`;
      }
    } else {
      rail += `<div class="line"></div>`;
    }
    return `<div class="period ${p.kind}${isFirst && p.kind === 'closed' ? ' now' : ''}"><div class="when"><div class="t">${when}</div><div class="d">${dur}</div></div><div class="rail">${rail}</div><div class="body">${body}</div></div>`;
  }

  function render() {
    const now = new Date();
    const age = C.loader.dataAgeSec(now);
    const paused = C.loader.pausedUntil && C.loader.pausedUntil > now;
    const upd = $('updated');
    if (C.loader.lastServerPoll) {
      const stale = age >= C.CFG.staleWarnSec && !paused;
      upd.textContent = paused ? `Timetable from ${C.hhmm(C.loader.lastServerPoll)}` : (stale ? 'Last data ' : 'Train data ') + C.hhmm(C.loader.lastServerPoll);
      upd.classList.toggle('warn', stale || !!paused);
    }
    const closures = C.buildClosures(C.loader.trains);
    const periods = C.buildPeriods(closures, now);
    if (C.loader.version) {
      const d = C.loader.startedAt;
      $('version').textContent = `Version ${C.loader.version}` + (d ? ` · live since ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} ${C.hhmm(d)}` : '');
    }

    $('strip').innerHTML = periods.map((p, i) => `<div class="${p.kind}${i === 0 && p.kind === 'closed' ? ' now' : ''}" style="flex:${p.seconds}" title="${p.kind} ${C.hhmm(p.start)} to ${C.hhmm(p.end)}"></div>`).join('');
    const windowMs = C.CFG.windowMin * 60000;
    const lifts = [];
    for (const c of closures) for (const l of c.lifts) if (l.at > now && l.at - now < windowMs) lifts.push(l);
    $('stripLifts').innerHTML = lifts.map(l => `<span class="strip-lift" style="left:${(100 * (l.at - now) / windowMs).toFixed(1)}%"></span>`).join('');
    $('legendLift').classList.toggle('hidden', lifts.length === 0);
    const axis = ['now'];
    for (let m = 30; m <= 90; m += 30) axis.push(C.hhmm(new Date(now.getTime() + m * 60000)));
    $('stripAxis').innerHTML = axis.map(a => `<span>${a}</span>`).join('');

    if (age != null && age >= C.CFG.staleFailSec && (!paused || age >= C.CFG.windowMin * 60)) {
      $('timeline').innerHTML = `<div class="empty">Train data hasn't updated for ${C.minutesWord(age)}, so the timeline can't be predicted. Use the lights and barrier at the crossing.</div>`;
      return;
    }
    if (!closures.length) {
      $('timeline').innerHTML = `<div class="empty">No closures expected in the next 90 minutes.</div>`;
      return;
    }
    $('timeline').innerHTML = periods.map((p, i) => periodHtml(p, now, i === 0)).join('');
  }

  async function refresh() {
    try { await C.loader.fetch(); } catch (e) { console.warn('fetch failed', e); }
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  refresh();
  setInterval(refresh, 30000);
  setInterval(render, 10000);
})();
</script>
</body>
</html>
