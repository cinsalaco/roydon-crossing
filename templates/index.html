<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crossing">
<meta name="theme-color" id="themeColor" content="#0E6B3A">
<title>Roydon level crossing</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0E6B3A;
    --amber: #F0A202;
    --red: #B81F1E;
    --grey: #4A4F57;
    --ink: #15171a;
    --panel: #F2F3F5;
    --fg: #ffffff;
    --rule: rgba(255,255,255,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
    background: var(--green);
    color: var(--fg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    transition: background 0.4s ease;
  }
  body.state-open   { background: var(--green); --bg: var(--green); --fg: #ffffff; --rule: rgba(255,255,255,0.3); }
  body.state-closing{ background: var(--amber); --bg: var(--amber); --fg: #1a1200; --rule: rgba(0,0,0,0.22); }
  body.state-closed { background: var(--red);   --bg: var(--red);   --fg: #ffffff; --rule: rgba(255,255,255,0.3); }
  body.state-unavailable { background: var(--grey); --bg: var(--grey); --fg: #ffffff; --rule: rgba(255,255,255,0.25); }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }

  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom));
  }
  @media (max-width: 360px) { .page { padding-left: 18px; padding-right: 18px; } }

  .state { margin-top: 4px; padding: 16px 18px; border-radius: 12px; background: rgba(255,255,255,0.16); border: 1.5px solid rgba(255,255,255,0.35); }
  body.state-closed .state, body.state-unavailable .state { background: rgba(0,0,0,0.22); }
  body.state-closing .state { background: rgba(0,0,0,0.10); border-color: rgba(0,0,0,0.3); }
  .state-word { font-size: clamp(40px, 14vw, 56px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .state-line { font-size: clamp(16px, 4.6vw, 18px); font-weight: 500; line-height: 1.3; margin-top: 8px; }

  .count { margin-top: clamp(20px, 4vh, 30px); }
  .count-label { font-size: 18px; font-weight: 500; opacity: 0.85; }
  .count-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .count-value { font-size: clamp(76px, 29vw, 116px); font-weight: 700; font-stretch: 75%; line-height: 0.92; letter-spacing: -0.03em; margin-top: 4px; }
  .count-detail { font-size: 18px; font-weight: 600; opacity: 0.9; line-height: 1.25; }
  .count-detail small { display: block; font-size: 18px; font-weight: 500; opacity: 0.8; }

  .strip-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 28px; padding: 14px 16px 12px; border-radius: 12px; background: var(--panel); color: var(--ink); }
  .strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 600; }
  .legend { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .strip-wrap { position: relative; height: 16px; margin-top: 18px; }
  .strip { display: flex; height: 16px; border-radius: 3px; overflow: hidden; gap: 2px; }
  .strip div { min-width: 2px; }
  .strip .open { background: var(--green); }
  .strip .closed { background: var(--red); }
  .strip .closed.now { background: #7A1211; }
  .strip-now { position: absolute; left: 0; top: -3px; width: 3px; height: 22px; background: var(--ink); border-radius: 1px; }
  .strip-next { position: absolute; top: -16px; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .strip-next::after { content: ''; position: absolute; left: 50%; top: 13px; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid currentColor; }
  .strip-next.closed { color: var(--red); } .strip-next.open { color: var(--green); }
  .strip-axis { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.65; margin-top: 4px; }
  .strip-axis span:first-child { font-weight: 700; opacity: 1; }
  .strip-sentence { font-size: 14px; font-weight: 500; margin-top: 4px; }

  .trains { margin-top: 22px; }
  .trains h2 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; opacity: 0.8; padding-bottom: 4px; }
  .train { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 15px; }
  .train:last-child { border-bottom: 1px solid var(--rule); }
  .train.gone { opacity: 0.6; }
  .train .t { font-weight: 700; min-width: 46px; white-space: nowrap; }
  .train .t .delta { font-size: 12px; font-weight: 700; margin-left: 4px; padding: 1px 5px; border-radius: 4px; color: #fff; background: var(--red); }
  .train .t .delta.early { background: var(--blue, #1565c0); }
  body.state-closed .train .t .delta { background: #fff; color: var(--red); }
  body.state-closed .train .t .delta.early { background: #fff; color: var(--blue, #1565c0); }
  .train .tag.late { font-weight: 700; }
  .train .route { flex: 1; }
  .train .tag { font-size: 13px; opacity: 0.85; white-space: nowrap; }
  .lift-note { display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin: 4px 0; border-radius: 6px; background: rgba(255,255,255,0.18); font-size: 13px; font-weight: 600; }
  body.state-closing .lift-note { background: rgba(0,0,0,0.12); }

  .spacer { flex: 1; min-height: 20px; }
  :root { --blue: #1565c0; }
  .footer { display: flex; flex-direction: column; gap: 10px; }
  .footer .primary { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 17px; font-weight: 700; text-decoration: none; }
  .footer .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 500; }
  .footer .meta a { display: inline-flex; align-items: center; min-height: 36px; color: inherit; opacity: 0.8; text-decoration: underline; text-underline-offset: 3px; }
  .footer .updated { flex: 1; text-align: right; opacity: 0.75; }
  .footer .updated.warn { opacity: 1; font-weight: 600; }
  .footer a:focus-visible, .retry:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; border-radius: 4px; }

  .retry { margin-top: 32px; align-self: flex-start; min-height: 48px; padding: 0 22px; border: 2px solid rgba(255,255,255,0.7); border-radius: 10px; background: transparent; color: inherit; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body class="state-open">
<main class="page">
  <div class="state">
    <h1 class="state-word" id="stateWord">Loading</h1>
    <p class="state-line" id="stateLine">Fetching live train data.</p>
  </div>

  <div class="count" id="count">
    <div class="count-label" id="countLabel"></div>
    <div class="count-row">
      <div class="count-value" id="countValue"></div>
      <div class="count-detail" id="countDetail"></div>
    </div>
  </div>

  <button type="button" class="retry hidden" id="retry">Try again now</button>

  <section class="strip-panel" id="stripPanel" aria-label="Next 90 minutes">
    <div class="strip-head">
      <span>Next 90 minutes</span>
      <span class="legend"><span><i style="background: var(--green)"></i>open</span><span><i style="background: var(--red)"></i>closed</span></span>
    </div>
    <div class="strip-wrap">
      <div class="strip-next hidden" id="stripMarker"></div>
      <div class="strip" id="strip" role="img" aria-label="Open and closed periods over the next 90 minutes"></div>
      <div class="strip-now" aria-hidden="true"></div>
    </div>
    <div class="strip-axis" id="stripAxis"></div>
    <div class="strip-sentence" id="stripNext"></div>
  </section>

  <section class="trains" id="trains">
    <h2><span id="trainsHeading">Trains in the next closure</span><span id="trainsCount"></span></h2>
    <div id="trainList"></div>
  </section>

  <div class="spacer"></div>

  <div class="footer">
    <a href="/timeline" class="primary">See the next 90 minutes <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="meta">
      <a href="/log">Log what I see</a>
      <span class="updated" id="updated">Loading…</span>
    </div>
  </div>
  <div class="sr-only" aria-live="polite" id="live"></div>
</main>

<script src="/static/crossing.js"></script>
<script>
(function () {
  const C = window.Crossing;
  const $ = id => document.getElementById(id);
  const THEME = { open: '#0E6B3A', closing: '#F0A202', closed: '#B81F1E', unavailable: '#4A4F57' };
  let lastAnnounced = '';
  let fetchFailures = 0;

  function trainRow(tr, now) {
    const gone = tr.openAt <= now;
    let time = C.hhmm(tr.at);
    if (tr.late) time += `<span class="delta">${tr.late} min late</span>`;
    else if (tr.early) time += `<span class="delta early">${tr.early} min early</span>`;
    let tag = tr.stops ? 'stops here' : 'passes through';
    if (gone) tag = 'gone';
    return `<div class="train${gone ? ' gone' : ''}"><span class="t">${time}</span><span class="route">${tr.origin} to ${tr.destination}${tr.freight ? ' (freight)' : ''}</span><span class="tag">${tag}</span></div>`;
  }

  function liftNote(l) {
    return `<div class="lift-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg><span>Barrier may lift for ${C.secondsWord(l.seconds)} around ${C.hhmm(l.at)}</span></div>`;
  }

  function renderTrains(closure, now) {
    if (!closure) { $('trains').classList.add('hidden'); return; }
    $('trains').classList.remove('hidden');
    let html = '';
    closure.trains.forEach((tr, i) => {
      html += trainRow(tr, now);
      const lift = closure.lifts.find(l => l.beforeTrain === closure.trains[i + 1]);
      if (lift) html += liftNote(lift);
    });
    $('trainList').innerHTML = html;
    const gone = closure.trains.filter(t => t.openAt <= now).length;
    const n = closure.trains.length;
    $('trainsCount').textContent = gone ? `${gone} of ${n} gone` : `${n} train${n === 1 ? '' : 's'}`;
  }

  function renderStrip(periods, closures, now, state) {
    const total = periods.reduce((s, p) => s + p.seconds, 0) || 1;
    $('strip').innerHTML = periods.map((p, i) => `<div class="${p.kind}${i === 0 && p.kind === 'closed' ? ' now' : ''}" style="flex:${p.seconds}" title="${p.kind} ${C.hhmm(p.start)} to ${C.hhmm(p.end)}"></div>`).join('');
    // marker for the next change of state
    const m = $('stripMarker');
    if (periods.length > 1) {
      const nextP = periods[1];
      const pct = Math.min(97, Math.max(3, 100 * (nextP.start - now) / (C.CFG.windowMin * 60000)));
      m.textContent = C.hhmm(nextP.start);
      m.className = 'strip-next ' + nextP.kind;
      m.style.left = pct + '%';
    } else {
      m.classList.add('hidden');
    }
    const axis = ['now'];
    for (let m = 30; m <= 90; m += 30) axis.push(C.hhmm(new Date(now.getTime() + m * 60000)));
    $('stripAxis').innerHTML = axis.map(a => `<span>${a}</span>`).join('');
    // "Next: closed 22:24 to 22:27, then open until 22:32"
    let text = '';
    const idx = periods.findIndex(p => p.end > now);
    const a = periods[idx + 1], b = periods[idx + 2];
    if (a) {
      text = `Next: ${a.kind} ${C.hhmm(a.start)} to ${C.hhmm(a.end)}`;
      if (b) text += `, then ${b.kind} until ${C.hhmm(b.end)}`;
    } else if (periods[idx] && periods[idx].kind === 'open') {
      text = 'No closures expected in the next 90 minutes';
    }
    $('stripNext').textContent = text;
  }

  function render() {
    const now = new Date();
    const age = C.loader.dataAgeSec(now);
    const closures = C.buildClosures(C.loader.trains);
    const paused = C.loader.pausedUntil && C.loader.pausedUntil > now;
    const state = C.stateAt(closures, now, age, paused);


    document.body.className = 'state-' + state.kind;
    $('themeColor').setAttribute('content', THEME[state.kind]);

    // data-time note in the footer
    const upd = $('updated');
    if (C.loader.lastServerPoll) {
      if (paused) {
        upd.textContent = `Timetable from ${C.hhmm(C.loader.lastServerPoll)}, live updates resume ${C.hhmm(C.loader.pausedUntil)}`;
        upd.classList.add('warn');
      } else {
        upd.textContent = (age >= C.CFG.staleWarnSec ? 'Updating… last data ' : 'Train data ') + C.hhmm(C.loader.lastServerPoll);
        upd.classList.toggle('warn', age >= C.CFG.staleWarnSec);
      }
    }

    const word = $('stateWord'), line = $('stateLine');
    const count = $('count'), label = $('countLabel'), value = $('countValue'), detail = $('countDetail');
    $('retry').classList.add('hidden');
    $('stripPanel').classList.remove('hidden');
    count.classList.remove('hidden');

    if (state.kind === 'unavailable') {
      word.textContent = 'Status unavailable';
      line.textContent = `Train data hasn't updated for ${C.minutesWord(state.dataAgeSec)}. Crossing status can't be predicted.`;
      label.textContent = ''; value.textContent = '';
      detail.innerHTML = '<small>Use the lights and barrier at the crossing. This page will update by itself when the data comes back.</small>';
      $('retry').classList.remove('hidden');
      $('stripPanel').classList.add('hidden');
      $('trains').classList.add('hidden');
      announce('Status unavailable');
      return;
    }

    const c = state.closure;
    if (state.kind === 'closed') {
      word.textContent = 'Closed';
      const n = c.trains.length;
      if (state.inLift) {
        line.textContent = 'Another train is close behind. The barrier may lift briefly, or stay down.';
      } else if (state.upcomingLift) {
        line.textContent = `Expected closed for ${n} trains. The barrier may lift briefly in between.`;
      } else {
        line.textContent = n === 1 ? 'Expected closed for 1 train.' : `Expected closed for ${n} trains.`;
      }
      label.textContent = 'Expected to open in';
      value.textContent = C.countdown(state.secondsToChange);
      detail.innerHTML = `at ${C.hhmm(c.openAt)}` + (state.nextAfter ? `<small>then open ${Math.max(1, Math.round((state.nextAfter.closeAt - c.openAt) / 60000))} min</small>` : '');
      $('trainsHeading').textContent = 'Trains in this closure';
    } else if (state.kind === 'closing') {
      word.textContent = 'Closing';
      line.textContent = 'Expected to close within a minute.';
      label.textContent = 'Expected to close in';
      value.textContent = C.countdown(state.secondsToChange);
      detail.innerHTML = `until ${C.hhmm(c.openAt)}<small>for ${Math.max(1, Math.round(c.durationSec / 60))} min</small>`;
      $('trainsHeading').textContent = 'Trains in this closure';
    } else if (c) {
      word.textContent = 'Open';
      line.textContent = `No closure expected for another ${C.minutesWord(state.secondsToChange)}.`;
      label.textContent = 'Expected to close in';
      value.textContent = C.countdown(state.secondsToChange);
      detail.innerHTML = `at ${C.hhmm(c.closeAt)}<small>for ${Math.max(1, Math.round(c.durationSec / 60))} min</small>`;
      $('trainsHeading').textContent = 'Trains in the next closure';
    } else {
      word.textContent = 'Open';
      line.textContent = 'No closure expected in the next 90 minutes.';
      count.classList.add('hidden');
    }

    renderStrip(C.buildPeriods(closures, now), closures, now, state);
    renderTrains(c, now);
    announce(word.textContent);
  }

  function announce(text) {
    if (text !== lastAnnounced) { $('live').textContent = text; lastAnnounced = text; }
  }

  async function refresh() {
    try {
      await C.loader.fetch();
      fetchFailures = 0;
    } catch (e) {
      fetchFailures++;
      console.warn('fetch failed', e);
    }
    render();
  }

  $('retry').addEventListener('click', refresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  refresh();
  setInterval(refresh, 30000);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
